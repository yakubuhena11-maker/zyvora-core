<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zyvora Core</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: #0f1115;
    color: #eee;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 16px;
    text-align: center;
    font-size: 1.2em;
    font-weight: bold;
    border-bottom: 1px solid #2a2d34;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 12px;
    line-height: 1.4;
    white-space: pre-wrap;
  }
  .user { align-self: flex-end; background: #3a6df0; color: white; }
  .bot { align-self: flex-start; background: #22252c; color: #eee; }
  .status { align-self: flex-start; color: #888; font-style: italic; }
  form {
    display: flex;
    padding: 12px;
    border-top: 1px solid #2a2d34;
    gap: 8px;
  }
  input {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #2a2d34;
    background: #1a1c22;
    color: #eee;
    font-size: 1em;
  }
  button {
    padding: 12px 18px;
    border: none;
    border-radius: 8px;
    background: #3a6df0;
    color: white;
    font-size: 1em;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; }
</style>
</head>
<body>

<header>Zyvora Core</header>
<div id="chat"></div>

<form id="chat-form">
  <input id="input" type="text" placeholder="Type a message..." autocomplete="off" required />
  <button type="submit">Send</button>
</form>

<script>
  // Point this at your backend's chat endpoint once it's deployed.
  // The backend is what actually talks to the AI API — never call the AI API
  // directly from the browser, or you'd have to expose your API key here.
  const BACKEND_URL = "http://localhost:3000/api/chat";

  const chat = document.getElementById("chat");
  const form = document.getElementById("chat-form");
  const input = document.getElementById("input");

  function addMessage(text, className) {
    const div = document.createElement("div");
    div.className = "msg " + className;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    addMessage(text, "user");
    input.value = "";
    input.disabled = true;

    const statusEl = addMessage("Thinking...", "status");

    try {
      const res = await fetch(BACKEND_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text })
      });

      if (!res.ok) throw new Error("Server error: " + res.status);

      const data = await res.json();
      statusEl.remove();
      addMessage(data.reply || "(no reply received)", "bot");
    } catch (err) {
      statusEl.remove();
      addMessage("Error: " + err.message, "bot");
    } finally {
      input.disabled = false;
      input.focus();
    }
  });
</script>

</body>
</html>
